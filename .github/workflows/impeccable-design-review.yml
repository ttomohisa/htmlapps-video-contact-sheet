name: Impeccable design review
on:
  pull_request:
    paths:
      - "src/index.template.html"
      - "DESIGN.md"
      - ".agents/skills/impeccable/**"
      - ".github/workflows/impeccable-design-review.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Fetch checksum-pinned engine from the public GitHub Asset API
        shell: bash
        run: |
          target="$RUNNER_TEMP/impeccable-engine"
          url="https://api.github.com/repos/pbakaus/impeccable/releases/assets/719420595"
          expected="07b763dc00012e9acf219fe2d2e8980f0810fb8af2e4a41c090107a8351d412f"
          if curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 120 -sS \
              -H "Accept: application/octet-stream" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -o "$target" "$url" && echo "$expected  $target" | sha256sum --check --status; then
            chmod +x "$target"
            echo "IMPECCABLE_BIN=$target" >> "$GITHUB_ENV"
            echo "Verified official Impeccable engine downloaded via the GitHub Asset API"
          else
            rm -f "$target"
            echo "Asset API unavailable; trying the pinned official launcher" >&2
          fi
      - name: Prepare the verified Impeccable engine with retries
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6 7 8; do
            if .agents/skills/impeccable/scripts/impeccable engine-probe; then exit 0; fi
            echo "Engine download attempt ${attempt} failed; retrying..." >&2
            sleep 2
          done
          echo "Cannot run the official Impeccable engine" >&2
          exit 1
      - name: Load official Impeccable context
        run: .agents/skills/impeccable/scripts/impeccable context --target src/index.template.html
      - name: Generate the Operate-mode direction seed
        run: .agents/skills/impeccable/scripts/impeccable concept-seed --scope direction --mode operate
      - name: Run official deterministic design detector
        shell: bash
        run: |
          set +e
          .agents/skills/impeccable/scripts/impeccable detect --json src/index.template.html > "$RUNNER_TEMP/impeccable-detect.json" 2> "$RUNNER_TEMP/impeccable-error.log"
          code=$?
          set -e
          cat "$RUNNER_TEMP/impeccable-error.log"
          cat "$RUNNER_TEMP/impeccable-detect.json"
          echo "Detector exit code: $code (0=clean, 2=findings)"
          if [ "$code" -ne 0 ] && [ "$code" -ne 2 ]; then exit "$code"; fi
      - name: Upload detector result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: impeccable-design-findings
          path: |
            ${{ runner.temp }}/impeccable-detect.json
            ${{ runner.temp }}/impeccable-error.log
          if-no-files-found: ignore
          retention-days: 7
